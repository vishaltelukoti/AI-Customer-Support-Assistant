name: Backend CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt

      - name: Install test and training dependencies
        run: python -m pip install -r backend/requirements-dev.txt

      - name: Run backend tests
        run: python -m pytest -c backend/pytest.ini -q backend/tests

      - name: Build backend Docker image
        run: docker build -f backend/Dockerfile -t ai-customer-support-backend .

      - name: Smoke-test backend container health endpoint
        run: |
          container_id=$(docker run -d -p 8000:8000 ai-customer-support-backend)
          trap 'docker logs "$container_id"; docker rm -f "$container_id"' EXIT
          curl --fail --retry 10 --retry-connrefused --retry-delay 1 http://127.0.0.1:8000/health
